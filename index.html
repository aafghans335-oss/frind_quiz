<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>یک گفت‌وگوی شیرین</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: sans-serif;
    background: linear-gradient(135deg, #120018, #26002f, #111);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.box {
    width: 90%;
    max-width: 420px;
    background: rgba(255,255,255,0.08);
    padding: 30px 22px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,0,150,0.25);
}

h1 {
    font-size: 25px;
    margin-bottom: 10px;
}

h2 {
    font-size: 22px;
    line-height: 1.8;
}

input {
    width: 90%;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 17px;
    text-align: center;
    margin: 15px 0;
}

button {
    padding: 13px 25px;
    margin: 6px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#message {
    margin-top: 20px;
    font-size: 19px;
    line-height: 1.8;
}

/* انیمیشن آخر */

#final {
    display: none;
}

.emoji {
    position: fixed;
    font-size: 30px;
    animation: fall 3s linear infinite;
    top: -50px;
}

@keyframes fall {
    from {
        transform: translateY(-50px) rotate(0deg);
    }

    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

.heart {
    font-size: 55px;
    animation: heartBeat 1s infinite;
}

@keyframes heartBeat {
    50% {
        transform: scale(1.25);
    }
}
</style>
</head>

<body>

<div class="box" id="main">

    <h1>✨ یک گفت‌وگوی شیرین ✨</h1>

    <h2 id="question">
        سلام! 😊 اول از همه دوست دارم اسمت رو بدونم... اسمت چیه؟
    </h2>

    <div id="area">

        <input
            id="name"
            type="text"
            placeholder="اسمت را بنویس"
        >

        <br>

        <button onclick="nameAnswer()">
            ادامه 🌟
        </button>

    </div>

    <div id="message"></div>

</div>


<!-- صفحه پایانی -->

<div class="box" id="final">

    <div class="heart">❤️</div>

    <h1>🎉 خوشحال شدم! 🎉</h1>

    <h2>
        ممنون که وقتت را برای
        <br>
        <strong>صالح آراوین نوا</strong>
        <br>
        گذاشتی! 🌟
    </h2>

    <p>
        😊 خوشحالم که تا آخر همراه بودی!
    </p>

</div>


<script>

function nameAnswer() {

    let name = document.getElementById("name").value.trim();

    if (name === "") {

        document.getElementById("message").innerText =
            "اول اسمت را بنویس 😊";

        return;
    }

    document.getElementById("question").innerText =
        "آیا دوست میشی با من رفیق باشی؟ 🤝❤️";

    document.getElementById("message").innerText =
        "وای، " + name + "؟ چه اسم قشنگ و دوست‌داشتنی‌ای! ✨";

    document.getElementById("area").innerHTML = `

        <button onclick="friendAnswer(true)">
            بلی ❤️
        </button>

        <button onclick="friendAnswer(false)">
            نه 😅
        </button>

    `;
}


function friendAnswer(answer) {

    if (answer === true) {

        document.getElementById("message").innerText =
            "چه خوب! 😍 پس امروز یک دوست جدید پیدا کردم! ❤️";

    } else {

        document.getElementById("message").innerText =
            "اوه... حیف شد 😅 شاید یک روز نظرت عوض شد!";

    }

    document.getElementById("question").innerText =
        "خب رفیق جدید، حالا بگو... چند سالته؟ 😊";

    document.getElementById("area").innerHTML = `

        <input
            id="age"
            type="number"
            placeholder="سنت را بنویس"
        >

        <br>

        <button onclick="ageAnswer()">
            ادامه 🌟
        </button>

    `;
}


function ageAnswer() {

    let age = document.getElementById("age").value;

    if (age === "") {

        document.getElementById("message").innerText =
            "اول سنت را بنویس 😊";

        return;
    }

    showFinal();

}


function showFinal() {

    document.getElementById("main").style.display = "none";

    document.getElementById("final").style.display = "block";

    // ساختن ایموجی‌های شادی

    let emojis = [
        "🎉",
        "🎊",
        "✨",
        "🎈",
        "❤️",
        "🌟",
        "😊"
    ];

    for (let i = 0; i < 30; i++) {

        let emoji = document.createElement("div");

        emoji.className = "emoji";

        emoji.innerText =
            emojis[Math.floor(Math.random() * emojis.length)];

        emoji.style.left =
            Math.random() * 100 + "%";

        emoji.style.animationDelay =
            Math.random() * 2 + "s";

        document.body.appendChild(emoji);
    }

}

</script>

</body>
</html>
